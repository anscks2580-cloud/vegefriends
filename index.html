<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>키친메이트 단가표 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f3f5f1; --panel:#ffffff; --fg:#1b241c; --muted:#5f6b60; --line:#dde3da;
  --accent:#1f7a22; --accent-soft:#e3f0e2; --accent-fg:#ffffff;
  --up:#d42a2a; --down:#1e5bd0; --warn:#9a6a00;
  --ui:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --radius:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 48px}
.top{margin-bottom:16px}
.top h1{margin:0;font-size:22px;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:12px}
@media (max-width:900px){.panel{position:static}}
.group{display:flex;flex-direction:column;gap:8px}
.group>label,.glabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.drop{position:relative;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:18px 14px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.drop strong{font-size:15px;color:var(--accent)}
.drop span{font-size:12px;color:var(--muted)}
.drop.over{outline:3px solid var(--accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.file{font-size:12px;color:var(--muted);word-break:break-all}
select,input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.up{color:var(--up)} .chip.down{color:var(--down)} .chip.new{color:var(--accent)}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:11px 12px;cursor:pointer;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:wait}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);margin:0}
.msg{font-size:13px;padding:9px 11px;border-radius:8px;background:var(--accent-soft)}
.msg.err{background:#fbe3e3}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.hist li{display:flex;justify-content:space-between;gap:8px}
.preview{min-width:0;display:flex;flex-direction:column;gap:12px}
.pbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;color:var(--muted);font-size:12px}
.banner{font-weight:600;color:var(--warn)}
.stage{overflow:hidden}
.pages{transform-origin:top left;display:flex;flex-direction:column;gap:16px;width:max-content}
#capture{position:fixed;left:-20000px;top:0}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs .seg{width:auto;grid-template-columns:auto auto}
.tabs .seg button{padding:8px 16px}
.etools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.sbtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 11px;cursor:pointer}
.sbtn.acc{border-color:var(--accent);color:var(--accent)}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 140px)}
table.et{width:100%;border-collapse:collapse;font-size:13px}
.et th{position:sticky;top:0;background:#eef3ec;font-size:12px;font-weight:700;color:var(--muted);padding:8px 6px;text-align:left;z-index:1;border-bottom:1px solid var(--line)}
.et td{border-bottom:1px solid var(--line);padding:3px 4px;vertical-align:middle}
.et tr.cathead td{background:#f6faf4;font-weight:700;color:var(--accent);font-size:12px;padding:6px 8px}
.et input,.et select{width:100%;font:inherit;font-size:13px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 7px;color:var(--fg)}
.et input:hover,.et select:hover{border-color:var(--line)}
.et input:focus,.et select:focus{outline:none;border-color:var(--accent);background:#fff}
.et input.pr{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.et input.edited{background:#fff6d6}
.et td.cg{text-align:center;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.et td.cg.up{color:var(--up)} .et td.cg.down{color:var(--down)} .et td.cg.same{color:#a5aea4} .et td.cg.new{color:var(--accent)}
.et td.act{white-space:nowrap;text-align:right}
.et td.act button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 5px;border-radius:5px}
.et td.act button:hover{background:var(--bg);color:var(--fg)}
.et td.act button.del:hover{color:var(--up)}
.et .prev{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* ================= 출력물 공통 ================= */
.page{background:#fff;color:#111;font-family:'Pretendard','Malgun Gothic',sans-serif;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08)}
.ex{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:#9a6a00;background:#fff4d6;padding:1px 10px;border-radius:99px;z-index:3}

/* ================= 단가표 (사진 양식) 873×1000 ================= */
.ps{--g:#1f7a22;--cat:#dcebd3;--ln:#2b2b2b;width:873px;height:1000px;padding:0;display:flex;flex-direction:column}
.ps-head{position:relative;height:92px;flex:none}
.ps-logo{position:absolute;left:17px;top:24px;width:52px}
.ps-brand{position:absolute;left:90px;top:8px}
.ps-brand b{display:block;font-family:'Roboto','Pretendard',sans-serif;font-size:27px;font-weight:600;color:var(--g);letter-spacing:-.025em;line-height:1.1}
.ps-brand i{display:block;font-style:normal;font-size:8px;font-weight:600;color:var(--g);letter-spacing:.02em;margin-top:3px}
.ps-brand small{display:block;font-size:8px;color:#333;line-height:1.5;margin-top:6px}
.ps-info{position:absolute;left:470px;width:300px;top:13px;text-align:center;color:#222}
.ps-info strong{display:block;font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.ps-info span{display:block;font-size:8.2px;line-height:1.45}
.ps-info .tel{margin-top:4px;font-size:10px;font-weight:600;color:var(--g)}
.ps-info .tel u{text-underline-offset:2px}
.ps-qr{position:absolute;right:8px;top:12px;width:45px;text-align:center}
.ps-qr .box{border:1.2px solid #2e9e3e;border-radius:5px;padding:3px;background:#fff}
.ps-qr svg{display:block;width:100%;height:auto}
.ps-qr span{display:block;font-size:6.5px;color:var(--g);font-weight:600;margin-top:3px;white-space:nowrap}
.ps-date{position:absolute;right:3px;bottom:2px;font-size:11px;font-weight:500;color:#111}
.ps-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;min-height:0}
.ps-col{display:flex;flex-direction:column;border:1.3px solid var(--ln);min-height:0}
.ps-cat{flex:none;height:20px;background:var(--cat);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.ps-col>.ps-cat:not(:first-child){border-top:1px solid var(--ln)}
.ps-sub{flex:none;height:16px;display:grid;grid-template-columns:62% 18% 20%;border-bottom:1px solid var(--ln);font-size:7.5px;color:#333}
.ps-sub span{display:flex;align-items:center;justify-content:center}
.ps-sub span+span,.ps-row span+span{border-left:1px solid var(--ln)}
.ps-row{display:grid;grid-template-columns:62% 18% 20%;border-bottom:1px solid var(--ln);min-height:0;flex-basis:0}
.ps-row:last-child{border-bottom:0}
.ps-row span{display:flex;align-items:center;min-width:0;overflow:hidden}
.ps-row .n{justify-content:center;text-align:center;font-size:11.8px;line-height:1.15;letter-spacing:-.01em}
.ps-row .u{justify-content:center;text-align:center;font-size:8.2px;line-height:1.15;letter-spacing:-.02em;white-space:nowrap}
.ps-row .p{justify-content:flex-end;padding-right:3px;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.ps-row .p.t{font-size:11px;justify-content:center;padding-right:0}
.ps.wchg .ps-sub,.ps.wchg .ps-row{grid-template-columns:50% 17% 20% 13%}
.ps-row .c{justify-content:center;font-size:8.6px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.ps-row .c.up{color:#d42a2a} .ps-row .c.down{color:#1e5bd0} .ps-row .c.same{color:#9aa49a} .ps-row .c.new{color:#1f7a22}
.ps-legend{position:absolute;right:120px;bottom:2px;font-size:8.5px;color:#555}
.ps-legend b{font-weight:700} .ps-legend .u{color:#d42a2a} .ps-legend .d{color:#1e5bd0}

/* ================= 거래처 상세 (A4) ================= */
.dp{--g:#1f7a22;--g2:#e7f2e5;--sub:#5b665b;--rule:#c9d6c6;width:794px;height:1123px;padding:30px 30px 26px;display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:12px;border-bottom:3px solid var(--g)}
.dh .b{display:flex;gap:12px;align-items:center}
.dh img{width:48px}
.dh b{display:block;font-size:24px;font-weight:700;color:var(--g);letter-spacing:-.02em;line-height:1.1}
.dh small{display:block;font-size:10px;color:var(--sub);line-height:1.5}
.dh .r{text-align:right;font-size:10.5px;color:var(--sub);line-height:1.6}
.dh .r strong{display:block;font-size:13px;color:#111}
.dtitle{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 8px;gap:12px}
.dtitle h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.meta{display:grid;grid-template-columns:repeat(4,auto);border:1px solid var(--rule);border-radius:5px;overflow:hidden;font-size:11px}
.meta span{padding:4px 9px;border-left:1px solid var(--rule)}
.meta span:nth-child(odd){background:var(--g2);font-weight:700;color:var(--sub)}
.meta span:first-child{border-left:0}
table.dt{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.dt th{background:var(--g);color:#fff;font-weight:700;font-size:10.5px;padding:6px 4px}
.dt td{border-bottom:1px solid #e3e9e1;padding:5px;vertical-align:middle;line-height:1.25}
.dt td.c{text-align:center} .dt td.r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.dt td.nm{font-weight:700} .dt td.sm{font-size:10px;color:var(--sub)}
.chg{font-size:10px;font-weight:800} .chg.up{color:#d42a2a} .chg.down{color:#1e5bd0} .chg.same{color:#a5aea4} .chg.new{color:var(--g)}
.dp.nochg .chgc{display:none}
.notes{margin-top:10px;font-size:10px;color:var(--sub);line-height:1.6}
.sf{margin-top:auto;padding-top:8px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-size:10px;color:var(--sub);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>키친메이트 단가표 생성기</h1>
    <p>단가 엑셀을 올리면 거래처에 보내는 단가표 양식 그대로 자동 정리되고, 이미지·PDF로 바로 저장됩니다.</p>
  </header>

  <div class="layout">
    <aside class="panel" aria-label="작업 패널">
      <div class="group">
        <span class="glabel">1. 엑셀 올리기</span>
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv">
          <strong>엑셀 파일 선택</strong>
          <span>또는 여기로 끌어다 놓기 · 엑셀/한셀 모두 가능</span>
        </label>
        <div class="file" id="fileName">지금은 11월 09일 단가표 예시를 보여주고 있어요.</div>
        <button type="button" class="sbtn" id="loadLast">엑셀 없이 마지막 확정본 불러와서 고치기</button>
        <div id="msg" hidden></div>
      </div>

      <div class="group" id="sheetGroup" hidden>
        <label for="sheet">시트 선택</label>
        <select id="sheet"></select>
      </div>

      <div class="group">
        <span class="glabel">2. 단가표 형식</span>
        <div class="seg" role="group" aria-label="단가표 형식">
          <button type="button" id="mGrid" aria-pressed="true">공용 단가표</button>
          <button type="button" id="mDetail" aria-pressed="false">거래처 상세</button>
        </div>
        <p class="hint" id="modeHint"></p>
      </div>

      <div class="group">
        <label for="dateLabel">기준일 표시</label>
        <input type="text" id="dateLabel">
      </div>
      <div class="group" id="clientGroup" hidden>
        <label for="client">거래처명</label>
        <input type="text" id="client" placeholder="예: 바맘">
      </div>

      <div class="group">
        <span class="glabel">3. 등락 표시</span>
        <label class="check"><input type="checkbox" id="showChg" checked> 직전 대비 ▲▼ 표시</label>
        <select id="basis" aria-label="등락 비교 기준"></select>
        <div class="stats" id="stats"></div>
      </div>

      <div class="group">
        <div class="row2">
          <button type="button" class="btn primary" id="pngBtn">이미지 저장</button>
          <button type="button" class="btn primary" id="pdfBtn">PDF 저장</button>
        </div>
        <p class="hint">카카오톡으로 보낼 때는 이미지, 출력할 때는 PDF가 편합니다.</p>
        <button type="button" class="btn ghost" id="confirmBtn">이 단가로 확정</button>
        <p class="hint">확정하면 이 단가가 저장되고, 다음 단가표의 등락 비교 기준이 됩니다.</p>
      </div>

      <div class="group">
        <span class="glabel">확정 이력</span>
        <ul class="hist" id="hist"></ul>
      </div>
    </aside>

    <section class="preview" aria-label="단가표 미리보기">
      <div class="tabs">
        <div class="seg" role="group" aria-label="보기 전환">
          <button type="button" id="tEdit" aria-pressed="true">표에서 수정</button>
          <button type="button" id="tView" aria-pressed="false">단가표 보기</button>
        </div>
        <div class="etools" id="etools">
          <span class="chip" id="editCount" hidden></span>
          <button type="button" class="sbtn" id="addCat">+ 분류 추가</button>
          <button type="button" class="sbtn acc" id="xlsxBtn">엑셀로 내려받기</button>
        </div>
      </div>
      <div class="pbar"><span id="pinfo"></span><span class="banner" id="banner"></span></div>
      <div class="editor" id="editor"></div>
      <div class="stage" id="stage" hidden><div class="pages" id="pages"></div></div>
    </section>
  </div>
</div>
<div id="capture" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ===== 키친메이트 단가표 엑셀 파서 ===== */
(function (root) {
  const norm = s => String(s == null ? '' : s).replace(/\s+/g, '').replace(/[()（）]/g, '').toLowerCase();
  const clean = s => String(s == null ? '' : s).trim();

  function priceValue(raw) {
    if (raw == null || raw === '') return null;
    if (typeof raw === 'number') return raw;
    const s = String(raw);
    const nums = (s.match(/\d[\d,]*/g) || []).map(n => +n.replace(/,/g, '')).filter(n => n >= 100);
    if (!nums.length) return null;
    if (nums.length === 2 && /[~∼〜]/.test(s)) return (nums[0] + nums[1]) / 2;
    if (nums.length === 1) return nums[0];
    return null;
  }
  function priceText(raw) {
    if (raw == null || raw === '' || String(raw).trim() === '-') return '시세 문의';
    if (typeof raw === 'number') return raw.toLocaleString('ko-KR');
    let s = String(raw).trim();
    if (/^[\d,]+$/.test(s)) return (+s.replace(/,/g, '')).toLocaleString('ko-KR');
    return s.replace(/원/g, '').replace(/\s*~\s*/g, '~').trim();
  }

  const COLS = {
    col: /^(단|열|칸|배치|위치)$/,
    cat: /^(분류|카테고리|구분|품목군)$/,
    name: /^(품목|품명|품목명|상품명)$/,
    unit: /(단위|규격|포장)/,
    prev: /(전일|직전|어제|이전|지난)/,
    grade: /(선별)/,
    origin: /(원산지)/,
    note: /(비고|메모)/,
    no: /^(번호|no|순번)$/i,
  };

  function findHeader(rows) {
    for (let r = 0; r < Math.min(rows.length, 30); r++) {
      const cells = rows[r].map(c => norm(c));
      if (cells.some(c => COLS.name.test(c)) && cells.some(c => /단가|가격/.test(c))) return r;
    }
    return -1;
  }
  function mapColumns(header) {
    const m = {};
    header.map(norm).forEach((c, i) => {
      if (!c) return;
      if (m.col == null && COLS.col.test(c)) m.col = i;
      else if (m.cat == null && COLS.cat.test(c)) m.cat = i;
      else if (m.name == null && COLS.name.test(c)) m.name = i;
      else if (m.no == null && COLS.no.test(c)) m.no = i;
      else if (m.unit == null && COLS.unit.test(c)) m.unit = i;
      else if (m.grade == null && COLS.grade.test(c)) m.grade = i;
      else if (m.origin == null && COLS.origin.test(c)) m.origin = i;
      else if (m.note == null && COLS.note.test(c)) m.note = i;
      else if (/단가|가격/.test(c) && !/참고|증감|등락/.test(c)) {
        if (COLS.prev.test(c)) { if (m.prev == null) m.prev = i; }
        else if (m.price == null) m.price = i;
      }
    });
    return m;
  }
  function parseSheet(ws, sheetName, XLSX) {
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    const hr = findHeader(rows);
    if (hr < 0) return { ok: false, sheetName, reason: '‘품목’과 ‘단가’ 제목 칸을 찾지 못했습니다.' };
    const col = mapColumns(rows[hr]);
    if (col.price == null) return { ok: false, sheetName, reason: '단가 열을 찾지 못했습니다.' };
    let date = null, client = '';
    for (let r = 0; r < hr; r++) rows[r].forEach((c, i) => {
      if (/^거래처$/.test(clean(c))) client = clean(rows[r].slice(i + 1).find(x => x !== ''));
      if (/작성일|적용일|기준일|날짜/.test(clean(c))) {
        const v = rows[r].slice(i + 1).find(x => x !== '');
        if (typeof v === 'number' && v > 40000 && v < 60000) date = new Date(Math.round((v - 25569) * 864e5));
        else if (v instanceof Date) date = v;

      const row = rows[r];

      const catCell = col.cat != null ? clean(row[col.cat]) : '';
      const colCell = col.col != null ? clean(row[col.col]) : '';
      if (catCell) curCat = catCell;
      if (colCell) curCol = colCell;
      if (!name) continue;
      if (/^[※*]/.test(name) || /안내|^합계/.test(name)) continue;
      items.push({
        cat: curCat || '공급 품목', col: +String(curCol).replace(/\D/g, '') || 0,
        no: col.no != null ? clean(row[col.no]) : '', name,
        unit: col.unit != null ? clean(row[col.unit]) : '',
        priceRaw: row[col.price], prevRaw: col.prev != null ? row[col.prev] : undefined,
        grade: col.grade != null ? clean(row[col.grade]) : '',
        origin: col.origin != null ? clean(row[col.origin]) : '',
        note: col.note != null ? clean(row[col.note]) : '',

      detailed: col.grade != null || col.origin != null, hasPrev: col.prev != null };
  }
  const parseWorkbook = (wb, XLSX) => wb.SheetNames.map(n => parseSheet(wb.Sheets[n], n, XLSX));

  function withChanges(items, baseline) {
    return items.map(it => {
      const now = priceValue(it.priceRaw);
      let prev = it.prevRaw !== undefined ? priceValue(it.prevRaw) : undefined;
      if (prev === undefined && baseline) { const k1 = norm(it.name + '|' + (it.unit || '')), k2 = norm(it.name); prev = k1 in baseline ? baseline[k1] : (k2 in baseline ? baseline[k2] : undefined); }
      let change = null, state = 'none';
      if (prev === undefined) state = baseline && Object.keys(baseline).length ? 'new' : 'none';
      else if (now != null && prev != null) { change = Math.round(now - prev); state = change > 0 ? 'up' : change < 0 ? 'down' : 'same'; }
      return Object.assign({}, it, { price: priceText(it.priceRaw), now, prev, change, state });

(function (root) {
  async function normalizeXlsx(buf, JSZip) {
    const zip = await JSZip.loadAsync(buf);
    let changed = false;
    for (const n of Object.keys(zip.files).filter(n => /\.(xml|rels)$/i.test(n))) {
      const txt = await zip.file(n).async('string');
      let out = txt.replace(/([A-Za-z])\s+=\s*"/g, '$1="').replace(/\s+\?>/, '?>')
        .replace(/<mc:AlternateContent\b[^>]*>([\s\S]*?)<\/mc:AlternateContent>/g, (a, inner) => { const fb = inner.match(/<mc:Fallback\b[^>]*>([\s\S]*?)<\/mc:Fallback>/); return fb ? fb[1] : ''; })
        .replace(/<hs:[^>]*\/>/g, '').replace(/<hs:(\w+)\b[^>]*>[\s\S]*?<\/hs:\1>/g, '');
      const m = out.match(/<([A-Za-z0-9]+):(workbook|worksheet|sst|styleSheet)\b/);
      if (m) { const p = m[1]; out = out.replace(new RegExp('<' + p + ':', 'g'), '<').replace(new RegExp('</' + p + ':', 'g'), '</').replace(new RegExp('xmlns:' + p + '=', 'g'), 'xmlns='); }
      if (out !== txt) { zip.file(n, out); changed = true; }
    }
    return changed ? await zip.generateAsync({ type: 'uint8array' }) : new Uint8Array(buf);
  }
  root.KMParser.normalizeXlsx = normalizeXlsx;

  return S.source === 'example' ? EX_BASE : {label:'확정본 없음', map:{}};
}

function computeItems(){
  let raw = S.raw;
  if (!(S.hasPrev && S.basis === 'excel')) raw = raw.map(i => Object.assign({}, i, {prevRaw: undefined}));

}

/* ===== 품목명 줄바꿈: 엑셀 줄바꿈 우선, 길고 괄호 앞에 띄어쓰기가 있으면 두 줄 ===== */
function nameLines(name){
  const s = String(name).trim();
  if (s.includes('\n')) return s.split(/\n+/).map(x => x.trim());
  const m = s.match(/^(.+?)\s+(\(.+\))$/);
  if (m && (s.length >= 9 || m[2].length >= 5)) return [m[1], m[2]];
  return [s];
}
const rowWeight = it => nameLines(it.name).length > 1 ? 1.32 : 1;

/* ===== 3단 배치 ===== */
const CAT_W = 1.8; // 분류 제목 + 소제목 높이를 행 단위로 환산
function layoutColumns(items){
  let cats = [];
  items.forEach(it => { let c = cats[cats.length-1]; if (!c || c.name !== it.cat) cats.push(c = {name: it.cat, col: it.col, items: []}); c.items.push(it); });
  const h = c => CAT_W + c.items.reduce((s, it) => s + rowWeight(it), 0);
  // 엑셀에 ‘단’ 번호가 모두 있으면 그대로
  if (cats.length && cats.every(c => c.col >= 1 && c.col <= 3)) {
    const cols = [[], [], []]; cats.forEach(c => cols[c.col - 1].push(c)); return cols;
  }
  // 없으면 세 칸 높이가 가장 고르게 되도록 순서대로 나눔
  const total = cats.reduce((s, c) => s + h(c), 0), limit = total / 3;
  cats = cats.flatMap(c => {
    if (h(c) <= limit * 1.08) return [c];
    const k = Math.min(3, Math.ceil(h(c) / limit)), per = Math.ceil(c.items.length / k), out = [];
    for (let i = 0; i < c.items.length; i += per) out.push({name: c.name + (i ? ' (계속)' : ''), items: c.items.slice(i, i + per)});
    return out;
  });
  const H = cats.map(h), pre = [0]; H.forEach(x => pre.push(pre[pre.length-1] + x));
  const sum = (a, b) => pre[b] - pre[a], n = cats.length;
  let best = null;
  for (let i = 0; i <= n; i++) for (let j = i; j <= n; j++) {
    const m = Math.max(sum(0, i), sum(i, j), sum(j, n));
    if (!best || m < best.m) best = {m, i, j};
  }
  return [cats.slice(0, best.i), cats.slice(best.i, best.j), cats.slice(best.j)];
}

async function handleFile(f){
  if (!f) return;
  try{
    const buf = await f.arrayBuffer();
    let data = new Uint8Array(buf);
    if (/\.(xlsx|xlsm)$/i.test(f.name)) data = await P.normalizeXlsx(buf, JSZip);
    const wb = XLSX.read(data, {type:'array'});
    const sheets = P.parseWorkbook(wb, XLSX);
    const ok = sheets.filter(s => s.ok && s.items.length);
    if (!ok.length){ showMsg(`단가표를 찾지 못했습니다. 제목 줄에 ‘품목’과 ‘단가’ 칸이 있는지 확인해 주세요.`, true); return; }
    S.sheets = ok; S.source = 'upload';
    $('sheet').innerHTML = ok.map((s, i) => `<option value="${i}">${esc(s.sheetName)} · ${s.items.length}개 품목</option>`).join('');
    $('sheetGroup').hidden = ok.length < 2;
    $('fileName').textContent = '📄 ' + f.name;
    useSheet(0);
    showMsg(`${ok[0].sheetName} 시트에서 ${ok[0].items.length}개 품목을 읽었습니다.`);
  }catch(e){ console.error(e); showMsg('파일을 읽지 못했습니다. 엑셀(.xlsx) 파일인지 확인해 주세요.', true); }
}
function useSheet(i){
  const s = S.sheets[i];
  S.raw = s.items.map(it => Object.assign({}, it, {orig: String(it.priceRaw)})); S.hasPrev = s.hasPrev;
  S.basis = s.hasPrev ? 'excel' : 'saved';
  S.mode = s.detailed ? 'detail' : 'grid';
  if (s.client) S.client = s.client;
  S.dateLabel = fmtDateLabel(s.date || new Date());
  $('dateLabel').value = S.dateLabel; $('client').value = S.client;
  S.tab = 'edit'; saveDraft();
  renderBasisSelect(); renderHistory(); render();
}

function saveDraft(){ if (S.source === 'example') return; store.set('km.draft', {raw: S.raw, dateLabel: S.dateLabel, source: S.source, at: Date.now()}); }
function loadDraft(){
  const d = store.get('km.draft', null); if (!d || !d.raw || !d.raw.length) return false;
  S.raw = d.raw; S.dateLabel = d.dateLabel || S.dateLabel; S.source = d.source || 'draft';
  $('fileName').textContent = '작업하던 단가표를 이어서 보여주고 있어요.';
  return true;
}
$('loadLast').onclick = () => {
  const r = records()[0]; if (!r || !r.items) { toast('불러올 확정본이 없습니다.'); return; }
  S.raw = r.items.map(it => Object.assign({grade:'', origin:'', note:'', no:''}, it, {orig: String(it.priceRaw)}));
  S.source = 'confirmed'; S.hasPrev = false; S.basis = 'saved'; S.mode = 'grid'; S.tab = 'edit';
  S.dateLabel = fmtDateLabel(new Date()); $('dateLabel').value = S.dateLabel;
  $('fileName').textContent = `${r.label} 확정본을 불러왔어요. 바뀐 단가만 고치면 됩니다.`;
  saveDraft(); renderBasisSelect(); renderHistory(); render();
};

/* ===== 엑셀로 내려받기 (입력 양식과 같은 모양) ===== */
$('xlsxBtn').onclick = () => {
  const m = S.dateLabel.match(/(\d+)월\s*(\d+)일/), y = new Date().getFullYear();
  const dateStr = m ? `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}` : '';
  const aoa = [['키친메이트 당일 단가 입력'], ['', '기준일', dateStr], ['단', '분류', '품목', '단위', '단가', '비고']]
    .concat(S.raw.map(it => [it.col || '', it.cat, String(it.name).replace(/\n/g, ' '), it.unit, typeof it.priceRaw === 'number' ? it.priceRaw : (P.priceValue(it.priceRaw) ?? it.priceRaw ?? ''), it.note || '']));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:5}, {wch:26}, {wch:20}, {wch:14}, {wch:10}, {wch:16}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '단가입력');
  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  saveFile(`키친메이트-단가입력-${S.dateLabel.replace(/\s|기준/g,'')}.xlsx`, new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
};

/* ===== 저장 (이미지 / PDF) ===== */
async function capturePages(){
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const cap = $('capture'); cap.innerHTML = $('pages').innerHTML;
  const out = [];
  for (const pg of cap.querySelectorAll('.page')){
    pg.style.boxShadow = 'none';
    const ex = pg.querySelector('.ex'); if (ex) ex.remove();
    out.push({canvas: await html2canvas(pg, {scale:2.8, backgroundColor:'#ffffff', logging:false}), w: pg.offsetWidth, h: pg.offsetHeight});
  }
  cap.innerHTML = '';
  return out;
}
const baseName = () => `키친메이트-단가표-${S.dateLabel.replace(/\s|기준/g,'')}${S.mode==='detail'&&S.client?'-'+S.client:''}`;
async function withBusy(btn, label, fn){
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try{ await fn(); }catch(e){ console.error(e); toast('저장하지 못했습니다. 다시 시도해 주세요.'); }
  finally{ btn.disabled = false; btn.textContent = old; }
}
$('pngBtn').onclick = () => withBusy($('pngBtn'), '만드는 중…', async () => {
  const pages = await capturePages();
  for (let i = 0; i < pages.length; i++){
    const blob = await new Promise(r => pages[i].canvas.toBlob(r, 'image/png'));
    await saveFile(baseName() + (pages.length > 1 ? `-${i+1}` : '') + '.png', blob);
  }
});
$('pdfBtn').onclick = () => withBusy($('pdfBtn'), '만드는 중…', async () => {
  const pages = await capturePages();
  const { jsPDF } = window.jspdf;
  const mm = p => [210, +(210 * p.h / p.w).toFixed(2)];
  const pdf = new jsPDF({unit:'mm', format: mm(pages[0]), orientation:'portrait'});
  pages.forEach((p, i) => { const [w, h] = mm(p); if (i) pdf.addPage([w, h], 'portrait'); pdf.addImage(p.canvas.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, w, h); });
  await saveFile(baseName() + '.pdf', pdf.output('blob'));
});
async function saveFile(name, blob){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast(name + ' 저장 완료');
}

(function migrate(){ const old = store.get('km.confirmed', null); if (old && !records().length && old.map) store.set('km.records', [old]); })();
loadDraft();
$('dateLabel').value = S.dateLabel;
renderBasisSelect(); renderHistory(); render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
